name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install IANA timezone data for cross-platform tests
        run: python -m pip install --disable-pip-version-check tzdata
      - name: Compile
        run: python -m compileall -q skills tests
      - name: Test
        run: python -m unittest discover -s tests -v
